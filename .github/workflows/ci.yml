name: CI
on:
  pull_request:
    branches: [develop, main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: governance
          POSTGRES_USER: app_owner
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app_owner"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_DB: governance
      POSTGRES_USER: app_owner
      POSTGRES_PASSWORD: postgres
      DJANGO_SECRET_KEY: ci-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: ${{ hashFiles('manage.py') != '' }}
        with:
          python-version: "3.12"
      - name: Zależności
        if: ${{ hashFiles('manage.py') != '' }}
        run: pip install -r requirements.txt ruff
      - name: Lint
        if: ${{ hashFiles('manage.py') != '' }}
        run: ruff check .
      - name: Testy
        if: ${{ hashFiles('manage.py') != '' }}
        run: python manage.py test