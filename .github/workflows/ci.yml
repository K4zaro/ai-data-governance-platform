name: CI

on:
  pull_request:
    branches: [develop, main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: governance
          POSTGRES_USER: app_owner
          POSTGRES_PASSWORD: 8B3018D13CB9B8DB264C242EE635912AEF71548A2C47D4EFB879E7C4F32F2BFDB1539E3FF718CA8C9ECE7BBA4C5ECA65
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app_owner -d governance"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: governance
      POSTGRES_USER: app_owner
      POSTGRES_PASSWORD: 8B3018D13CB9B8DB264C242EE635912AEF71548A2C47D4EFB879E7C4F32F2BFDB1539E3FF718CA8C9ECE7BBA4C5ECA65
      DJANGO_SECRET_KEY: 74F0904E87732A32969A4976824CD6F2BDEAA537CD464526241DA54F7EDA694D8D6338848350B9E0892605E7295B325C
      CELERY_BROKER_URL: memory://

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Tests
        run: python manage.py test
